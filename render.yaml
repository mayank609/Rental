# Render Blueprint — API (web service), background worker, Postgres, Redis.
# PostGIS: run `CREATE EXTENSION postgis;` once if your plan doesn't enable it
# automatically (the first migration also tries to create it).
services:
  - type: web
    name: rentnest-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    region: singapore
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKERS_IN_API
        value: "false"
      - key: DATABASE_URL
        fromDatabase: { name: rentnest-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: rentnest-redis, property: connectionString }
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - fromGroup: rentnest-secrets

  - type: worker
    name: rentnest-worker
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    region: singapore
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: rentnest-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: rentnest-redis, property: connectionString }
      - fromGroup: rentnest-secrets

  - type: redis
    name: rentnest-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: rentnest-db
    region: singapore
    plan: basic-1gb
    postgresMajorVersion: "16"

envVarGroups:
  - name: rentnest-secrets
    envVars:
      - key: APP_URL
        value: https://rentnest.in
      - key: API_URL
        value: https://api.rentnest.in
      - key: CORS_ORIGINS
        value: https://rentnest.in,https://www.rentnest.in
      - key: COOKIE_DOMAIN
        value: .rentnest.in
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: GEOCODER
        value: google
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
