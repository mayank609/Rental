# SPA + reverse proxy to the API (docker-compose). Crawler requests for
# public pages are proxied to the API which injects SEO meta tags.
map $http_user_agent $is_bot {
  default 0;
  ~*(googlebot|bingbot|yandex|baiduspider|duckduckbot|slurp|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot) 1;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location ~ ^/(api|uploads|socket\.io|sitemap\.xml|robots\.txt|seo/render) {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /sw.js { add_header Cache-Control "no-cache"; }

  location / {
    if ($is_bot) { rewrite ^(.*)$ /__seo$1 last; }
    try_files $uri /index.html;
  }

  # Bots get server-rendered meta via the API's SPA renderer
  location /__seo {
    internal;
    rewrite ^/__seo(.*)$ /seo/render?path=$1 break;
    proxy_pass http://api:4000;
  }
}
