name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — typecheck & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental
          POSTGRES_DB: rental_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rental" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rental:rental@localhost:5432/rental_test
      DATABASE_URL: postgresql://rental:rental@localhost:5432/rental_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
        working-directory: server
      - run: npm run typecheck -w server
      - run: npm test -w server

  client:
    name: Client — typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w client
      - run: npm test -w client -- --passWithNoTests
      - run: npx vite build
        working-directory: client
      - uses: actions/upload-artifact@v4
        with: { name: client-dist, path: client/dist, retention-days: 7 }

  e2e:
    name: E2E — booking flow (Playwright)
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: rental, POSTGRES_PASSWORD: rental, POSTGRES_DB: rental }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rental" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://rental:rental@localhost:5432/rental
      REDIS_URL: redis://localhost:6379
      OTP_DEV_ECHO: "true"
      GEOCODER: offline
      PAYMENT_PROVIDER: mock
      APP_URL: http://localhost:4173
      API_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npx prisma migrate deploy && npx tsx prisma/seed.ts
        working-directory: server
      - run: npx vite build
        working-directory: client
      - run: npx playwright test
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: client/playwright-report, retention-days: 7 }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, client]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: server/Dockerfile, push: false, tags: rentnest-api:ci }
      - uses: docker/build-push-action@v6
        with: { context: ., file: client/Dockerfile, push: false, tags: rentnest-web:ci }
